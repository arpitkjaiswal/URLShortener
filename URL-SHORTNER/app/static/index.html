<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <main class="shell">
    <section class="card">
      <div class="masthead">
        <p class="eyebrow">URL shortener</p>
        <span class="status-pill">local build</span>
      </div>

      <h1>Paste a URL. Get a link. Move on.</h1>
      <p class="lede">A small service for shortening, redirecting, and tracking links without the usual dashboard
        clutter.</p>

      <form id="shorten-form" class="form">
        <label class="label" for="url-input">Original URL</label>
        <div class="row">
          <input id="url-input" name="url" type="url" placeholder="https://example.com" required />
          <button type="submit" disabled>Shorten</button>
        </div>
        <label class="label" for="ttl-input">Live for (optional)</label>
        <div class="row ttl-row">
          <input id="ttl-input" name="ttl_value" type="number" min="1" step="1" placeholder="30" />
          <select id="ttl-unit" name="ttl_unit" aria-label="TTL unit">
            <option value="seconds">Seconds</option>
            <option value="minutes" selected>Minutes</option>
            <option value="hours">Hours</option>
            <option value="days">Days</option>
          </select>
        </div>
        <p class="field-hint">Leave blank to create a link with no expiry.</p>
      </form>

      <div id="message" class="message"></div>

      <!-- Recent URLs will be rendered here -->
      <section id="recent-urls" class="recent-urls"></section>

      <section class="hint">
        <span>API:</span>
        <code>POST /api/v1/shorten</code>
      </section>
    </section>
  </main>

  <!-- Modal for stats -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="ghost">Close</button>
      <h2>URL Stats</h2>
      <div id="stats-body"></div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/static/app.js"></script>
</body>

</html>
