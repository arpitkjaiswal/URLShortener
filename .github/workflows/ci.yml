name: Test URL Shortener
on:
  push:
    branches: [main, fix/render-ready-shortener]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: URL-SHORTNER/requirements*.txt
      - run: pip install -r URL-SHORTNER/requirements-dev.txt
      - run: ruff check URL-SHORTNER && ruff format --check URL-SHORTNER
      - name: SQLite tests
        if: matrix.database == 'sqlite'
        run: python -m pytest --cov=app --cov-report=term-missing
      - name: PostgreSQL tests
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://shortener:test-only-password@localhost:5432/shortener_test
        run: python -m pytest -q
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: URL-SHORTNER/requirements*.txt
      - run: pip install -r URL-SHORTNER/requirements-browser.txt
      - run: playwright install --with-deps chromium
      - run: python URL-SHORTNER/tests/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
