services:
  - type: web
    name: linkly
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        sync: false
        # Paste a free Neon PostgreSQL connection string, including sslmode=require.
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
