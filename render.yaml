services:
  - type: web
    name: url-shortener
    runtime: python
    plan: free
    rootDir: URL-SHORTNER
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO
      - key: CREATE_LIMIT_PER_MINUTE
        value: "30"

databases:
  - name: url-shortener-db
    plan: free
    databaseName: shortener
    user: shortener
    ipAllowList: []
